experiment:
  name: raw_1dcnn
  output_root: outputs
seed: 42
device: cuda
data:
  dataset_dir: data/raw/bci_competition_iii_dataset_i
  train_file: Competition_train.mat.gz
  competition_test_file: Competition_test.mat.gz
  split:
    train: 0.7
    val: 0.15
    test: 0.15
  sample_rate_hz: 1000
  class_names:
  - label_-1
  - label_1
preprocessing:
  normalization:
    enabled: true
  windowing:
    enabled: false
    size: 1000
    stride: 500
  spectrogram:
    enabled: false
    nperseg: 128
    noverlap: 96
    nfft: 128
    log_power: true
representation:
  name: raw
  normalize_raw: true
model:
  name: raw_cnn_1d
  channels:
  - 64
  - 128
  - 256
  kernel_size: 7
  dropout: 0.3
  classifier_hidden_dim: 128
training:
  batch_size: 16
  num_workers: 4
  epochs: 40
  learning_rate: 0.001
  weight_decay: 0.0001
  early_stopping_patience: 10
  monitor: balanced_accuracy
  monitor_mode: max
