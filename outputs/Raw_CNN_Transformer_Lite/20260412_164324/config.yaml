experiment:
  name: Raw_CNN_Transformer_Lite
  output_root: outputs
seed: 42
device: cpu
data:
  dataset_dir: data/raw/bci_competition_iii_dataset_i
  train_file: Competition_train.mat.gz
  competition_test_file: Competition_test.mat.gz
  split:
    train: 0.7
    val: 0.15
    test: 0.15
  sample_rate_hz: 1000
  class_names:
  - label_-1
  - label_1
preprocessing:
  normalization:
    enabled: true
  windowing:
    enabled: false
    size: 1000
    stride: 500
  augmentation:
    enabled: false
representation:
  name: raw
  normalize_raw: true
model:
  name: raw_cnn_transformer_1d
  channels:
  - 64
  - 128
  kernel_size: 7
  dropout: 0.2
  classifier_hidden_dim: 128
  transformer_layers: 1
  transformer_num_heads: 2
  transformer_ff_multiplier: 2
training:
  batch_size: 16
  num_workers: 4
  epochs: 40
  learning_rate: 0.001
  weight_decay: 0.0001
  early_stopping_patience: 10
  monitor: balanced_accuracy
  monitor_mode: max
